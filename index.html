<title>Nombre de voyageurs par gare SNCB 2025</title>
<style>
/* Mise en page : en-tête, rangée de filtres, trois grands chiffres, carte + panneau latéral (fiche et classement), notes. */
:root{--fond:#FBF7F8;--carte:#FFFFFF;--encre:#12303B;--encre-douce:#56666C;--titre:#056F95;--grille:#E8E8E8;--terre:#F3EFF0;--frontiere:#C3C5C6;--reseau:#8A8B8B;--normales:#056F95;--correspondance:#F39200;--selection:#DD112E}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--fond:#0E1E25;--carte:#142A33;--encre:#E6EDEF;--encre-douce:#9DB0B6;--titre:#4FB3D9;--grille:#26414B;--terre:#17313B;--frontiere:#33505A;--reseau:#5F767E;--normales:#2F95BC;--correspondance:#C27500;--selection:#FF4D63;color-scheme:dark}}
:root[data-theme="dark"]{--fond:#0E1E25;--carte:#142A33;--encre:#E6EDEF;--encre-douce:#9DB0B6;--titre:#4FB3D9;--grille:#26414B;--terre:#17313B;--frontiere:#33505A;--reseau:#5F767E;--normales:#2F95BC;--correspondance:#C27500;--selection:#FF4D63;color-scheme:dark}
:root{
  --f-texte:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --f-chiffres:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --rayon:10px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--fond);color:var(--encre);font-family:var(--f-texte);font-size:14px;line-height:1.45}
.page{max-width:1440px;margin:0 auto;padding-inline:16px;padding-block:18px 32px;display:grid;gap:14px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--titre);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;justify-content:space-between}
.top h1{margin:0;font-size:1.55rem;line-height:1.2;color:var(--titre);text-wrap:balance;font-weight:700}
.top p{margin:4px 0 0;color:var(--encre-douce)}
.toggles{display:flex;gap:6px}
.btn{border:1px solid var(--grille);background:var(--carte);border-radius:999px;padding:5px 12px;font-size:.85rem}
.btn:hover{border-color:var(--titre)}

.filtres{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:flex-end;background:var(--carte);border:1px solid var(--grille);border-radius:var(--rayon);padding:12px 14px}
.grp{border:0;margin:0;padding:0;display:grid;gap:5px;min-width:0}
.grp legend,.lbl{padding:0;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--encre-douce);font-weight:600;margin-bottom:5px}
.recherche{position:relative;flex:1 1 260px;min-width:0;max-width:420px}
.recherche input{width:100%;border:1px solid var(--grille);background:var(--fond);border-radius:8px;padding:8px 11px 8px 32px}
.recherche svg{position:absolute;left:10px;bottom:11px;width:15px;height:15px;stroke:var(--encre-douce);fill:none;stroke-width:2}
.sugg{position:absolute;z-index:20;left:0;right:0;top:100%;margin:4px 0 0;padding:4px;list-style:none;background:var(--carte);border:1px solid var(--grille);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.14);max-height:320px;overflow:auto}
.sugg li{padding:7px 9px;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
.sugg li small{color:var(--encre-douce)}
.sugg li[aria-selected="true"],.sugg li:hover{background:var(--fond)}
.sugg li.vide{cursor:default;color:var(--encre-douce)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chk{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--grille);border-radius:999px;padding:5px 12px 5px 9px;cursor:pointer;user-select:none;background:var(--fond)}
.chk input{accent-color:var(--titre);margin:0;width:15px;height:15px}
.chk:has(input:checked){border-color:var(--titre);background:var(--carte);font-weight:600}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--grille);border-radius:999px;padding:2px;background:var(--fond);gap:2px}
.seg button{border:0;background:transparent;border-radius:999px;padding:5px 13px;display:inline-flex;align-items:center;gap:7px}
.seg button[aria-pressed="true"]{background:var(--titre);color:#fff;font-weight:600}
.pastille{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none;border:1.5px solid rgba(255,255,255,.7)}

.selbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--carte);border:1px solid var(--selection);border-radius:var(--rayon);padding:7px 12px}
.selbar .lbl{margin:0}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--fond);border-radius:999px;padding:3px 4px 3px 11px;font-weight:600}
.chip button{border:0;background:var(--grille);border-radius:50%;width:22px;height:22px;line-height:1;font-size:15px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.kpi{background:var(--carte);border:1px solid var(--grille);border-radius:var(--rayon);padding:12px 16px;min-width:0}
.kpi .val{font-family:var(--f-chiffres);font-size:1.9rem;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums;color:var(--encre);overflow-wrap:anywhere}
.kpi .val.nom{font-size:1.25rem;line-height:1.3;padding-block:4px}
.kpi .sub{color:var(--encre-douce);font-size:.85rem;margin-top:2px}

.main{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px;align-items:start}
@media (max-width:980px){.main{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--carte);border:1px solid var(--grille);border-radius:var(--rayon);min-width:0}
.panel-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--grille)}
.panel-head h2,.side h2{margin:0;font-size:1rem;color:var(--titre)}
.actions{display:flex;flex-wrap:wrap;gap:6px}
.actions .btn{padding:4px 10px;font-size:.8rem}
.map{position:relative;height:var(--h-carte,640px);overflow:hidden;touch-action:none;border-radius:0 0 var(--rayon) var(--rayon)}
@media (max-width:700px){.map{height:400px}.legend{font-size:.7rem;padding:6px 8px}}
.map > svg{display:block;width:100%;height:100%;cursor:grab;user-select:none}
.map > svg.drag{cursor:grabbing}
.zoom{position:absolute;right:10px;top:10px;display:grid;gap:4px}
.zoom button{width:32px;height:32px;border:1px solid var(--grille);background:var(--carte);border-radius:8px;font-size:17px;line-height:1;display:grid;place-items:center}
.zoom button svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;cursor:pointer}
.legend{position:absolute;left:10px;bottom:10px;background:color-mix(in srgb,var(--carte) 90%,transparent);border:1px solid var(--grille);border-radius:8px;padding:8px 10px;font-size:.78rem;display:grid;gap:6px;max-width:calc(100% - 20px)}
.legend svg{display:block;cursor:default}
.legend .lg-row{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.legend .lg-row span{display:inline-flex;align-items:center;gap:5px}
.tip{position:absolute;z-index:10;pointer-events:none;background:var(--carte);border:1px solid var(--grille);border-radius:8px;padding:8px 10px;box-shadow:0 6px 18px rgba(0,0,0,.18);font-size:.82rem;min-width:170px;max-width:260px}
.tip b{display:block;font-size:.9rem}
.tip .autre{color:var(--encre-douce);font-size:.78rem}
.tip table{border-collapse:collapse;margin-top:5px;width:100%}
.tip td{padding:1px 0;font-variant-numeric:tabular-nums}
.tip td:last-child{text-align:right;font-weight:600;padding-left:10px}
.vide{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;color:var(--encre-douce);font-weight:600;font-size:1rem}
.vide span{background:var(--carte);border:1px solid var(--grille);border-radius:8px;padding:8px 14px}
.aide{margin:0;padding:8px 14px 10px;color:var(--encre-douce);font-size:.78rem}

.side{padding:12px 14px;display:grid;gap:12px}
.fiche{border:1px solid var(--selection);border-radius:8px;padding:10px 12px;display:grid;gap:6px}
.fiche-tete{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.fiche h3{margin:0;font-size:1.05rem}
.fiche .autre{color:var(--encre-douce);font-size:.82rem}
.fiche table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:.85rem}
.fiche th,.fiche td{padding:4px 4px;border-bottom:1px solid var(--grille);text-align:right}
.fiche th:first-child,.fiche td:first-child{text-align:left}
.fiche th{font-weight:600;color:var(--encre-douce);font-size:.75rem}
.fiche tr.off td{color:var(--encre-douce);opacity:.7}
.fiche .note{font-size:.75rem;color:var(--encre-douce);margin:0}
.rank{list-style:none;margin:0;padding:0;display:grid;gap:1px}
.rank li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:2px 8px;align-items:center;padding:5px 6px;border-radius:6px;cursor:pointer}
.rank li:hover{background:var(--fond)}
.rank li.sel{background:var(--fond);outline:1.5px solid var(--selection)}
.rank li.sep{cursor:default;padding:0;height:8px}
.rank .num{color:var(--encre-douce);font-variant-numeric:tabular-nums;font-size:.78rem;text-align:right}
.rank .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .v{font-variant-numeric:tabular-nums;font-weight:600;font-size:.85rem}
.rank .bar{grid-column:2/4;height:6px;border-radius:3px;background:var(--grille);display:flex;overflow:hidden}
.rank .bar i{display:block;height:100%}
.more{justify-self:start}

.notes{display:grid;gap:8px;color:var(--encre);font-size:.84rem;max-width:110ch;border-top:1px solid var(--grille);padding-top:14px}
.notes p{margin:0}
.notes .src-titre{font-weight:700;color:var(--titre);font-size:.95rem}
.defs{margin:0;display:grid;gap:8px}
.defs div{display:grid;gap:2px}
.defs dt{font-weight:700}
.defs dd{margin:0}
.notes .calc{color:var(--encre-douce);font-size:.78rem}
.msg{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--encre);color:var(--carte);padding:8px 14px;border-radius:8px;z-index:50;font-size:.85rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="page">
  <header class="top">
    <div>

      <p id="t-sous"></p>
    </div>
  </header>

        <button type="button" data-m="embarques" id="m-embarques"><span class="pastille" style="background:var(--correspondance)"></span><span></span></button>
      </div>
    </fieldset>
  </section>

  <div class="selbar" id="selbar" hidden>
    <span class="lbl" id="t-selection"></span>
    <span class="chip"><span id="sel-nom"></span><button type="button" id="sel-x">×</button></span>

  <section class="kpis" id="kpis">

  </section>

  <section class="main">
    <div class="panel">
      <div class="panel-head">
        <h2 id="t-carte"></h2>
      </div>
      <div class="map" id="map">
        <svg id="svg" role="img" aria-labelledby="t-carte">
          <g id="g-base">
            <path id="p-prov" fill="var(--terre)" stroke="var(--frontiere)" stroke-width="0.8" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
            <path id="p-bxl" fill="var(--terre)" stroke="var(--frontiere)" stroke-width="1.2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
            <path id="p-r1" fill="none" stroke="var(--reseau)" stroke-width="0.7" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>
            <path id="p-r2" fill="none" stroke="var(--reseau)" stroke-width="1.3" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>
          </g>
          <g id="g-dots"></g>
          <g id="g-labels"></g>
        </svg>
        <div class="zoom">
          <button type="button" id="z-plus">+</button>
          <button type="button" id="z-moins">−</button>
          <button type="button" id="z-tout"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
        </div>
        <div class="legend" id="legend"></div>
        <div class="tip" id="tip" hidden></div>
        <div class="vide" id="vide" hidden><span id="vide-t"></span></div>
      </div>
      <p class="aide" id="t-aide"></p>
    </div>

    <aside class="panel side">
      <div class="fiche" id="fiche" hidden></div>
      <h2 id="t-classement"></h2>
      <ol class="rank" id="rank"></ol>
      <button class="btn more" type="button" id="more"></button>
    </aside>
  </section>

  <footer class="notes">
    <p class="src-titre" id="n-source"></p>
    <p class="calc" id="n-resume"></p>
    <dl class="defs" id="n-defs"></dl>
    <p id="n-etoile"></p>
    <p class="calc" id="n-combi"></p>
    <p class="calc" id="n-autres"></p>
  </footer>
</div>

const RG = D.reglages;

const norm = s => String(s || "").replace(/œ/g, "oe").replace(/Œ/g, "OE").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]/g, "");

};
const nomG = g => S.lang === "nl" ? g.nl : g.fr;
const autreG = g => S.lang === "nl" ? g.fr : g.nl;
const fmt = (v, d = 0) => new Intl.NumberFormat(S.lang === "nl" ? "nl-BE" : "fr-BE", { maximumFractionDigits: d, minimumFractionDigits: d }).format(v);

/* ---------- calculs ---------- */
const AUCUN = () => !S.jours.some(Boolean);  // aucun type de jour coché : rien à afficher
function combine(arr) {
  if (AUCUN()) return 0;
  let s = 0, w = 0;
  for (let j = 0; j < 3; j++) if (S.jours[j]) { s += RG.poids[j] * arr[j]; w += RG.poids[j]; }
  const plusieurs = S.jours.filter(Boolean).length > 1;
  if (!plusieurs) { const j = S.jours.indexOf(true); return arr[j]; }
  return RG.combinaison === "somme" ? s : (w ? s / w : 0);
}
let V = [];       // valeur affichée par gare

function calculer() {

/* ---------- couleurs résolues (pour la carte et les exports) ---------- */
function palette(clair) {

}

function vueEnsemble() {
  const a = S0;

function zoomer(f, px, py) {
  const v = S.view;

  f = a / v.a;

  S.view = { a, bx: px - (px - v.bx) * f, by: py - (py - v.by) * f };

let EXPORT_K = 1;
function dotsSVG(P, view, w, h, export_) {

    }
    if (S.mode === "deux") {  // embarqués en orange, transportés en bleu à l'intérieur
      out.push(`<circle data-i="${i}" cx="${cx}" cy="${cy}" r="${R.toFixed(2)}" fill="${P.correspondance}" fill-opacity="0.92" stroke="${fond}" stroke-width="0.8"/>`);
      if (VN[i] > 0) out.push(`<circle data-i="${i}" cx="${cx}" cy="${cy}" r="${Math.min(R, r(VN[i])).toFixed(2)}" fill="${P.normales}" fill-opacity="0.95"/>`);
    } else {
      const col = S.mode === "transportes" ? P.normales : P.correspondance;
      out.push(`<circle data-i="${i}" cx="${cx}" cy="${cy}" r="${R.toFixed(2)}" fill="${col}" fill-opacity="0.88" stroke="${fond}" stroke-width="0.8"/>`);
    }
  }
  if (S.sel >= 0) {
    const g = G[S.sel];
    const X = g.x * view.a + view.bx, Y = g.y * view.a + view.by;
    out.push(`<circle cx="${X.toFixed(1)}" cy="${Y.toFixed(1)}" r="${(r(V[S.sel]) + 3.5).toFixed(2)}" fill="none" stroke="${P.selection}" stroke-width="2.5" pointer-events="none"/>`);
  }
  return out.join("");
}

/* Mesure de texte pour placer les noms */
const ctxMesure = document.createElement("canvas").getContext("2d");
const POLICE = '"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif';
function largeur(txt, px, gras) { ctxMesure.font = `${gras ? 600 : 400} ${px}px ${POLICE}`; return ctxMesure.measureText(txt).width; }

function labelsSVG(P, view, w, h, export_) {
  if (AUCUN()) return "";
  const zz = export_ ? Math.pow(view.a / S0, 0.42) * BF() * EXPORT_K : zf();
  const fk = export_ ? EXPORT_K : 1;
  const r = v => v <= 0 ? RG.rmin * zz : (RG.rmin + (RG.rmax - RG.rmin) * Math.sqrt(v / VMAX)) * zz;
  const kz = view.a / S0;
  const max = Math.min(160, Math.round(RG.etiquettes * Math.max(1, kz * 1.1)));
  const obst = [];
  const visibles = [];
  for (const i of ORDRE) {
    const g = G[i];
    const X = g.x * view.a + view.bx, Y = g.y * view.a + view.by;
    if (X < 0 || Y < 0 || X > w || Y > h) continue;
    const R = r(V[i]);
    const rg = visibles.length;
    visibles.push({ i, X, Y, R, rg });
    if (R >= 2.5 && obst.length < 600) obst.push({ x0: X - R, y0: Y - R, x1: X + R, y1: Y + R, i, rg });
  }
  const placees = [];
  const coupe = (a, b) => a.x0 < b.x1 && a.x1 > b.x0 && a.y0 < b.y1 && a.y1 > b.y0;
  const out = [];
  const liste = visibles.slice(0, max);
  if (S.sel >= 0 && !liste.some(o => o.i === S.sel)) { const o = visibles.find(o => o.i === S.sel); if (o) liste.unshift(o); }
  else if (S.sel >= 0) { liste.sort((a, b) => (b.i === S.sel) - (a.i === S.sel)); }
  for (const o of liste) {
    const g = G[o.i];
    const sel = o.i === S.sel;
    const txt = nomG(g);
    const fs = (sel ? 13 : (o.R > 12 * fk ? 12.5 : 11.5)) * fk;
    const gras = sel || o.R > 12 * fk;
    const tw = largeur(txt, fs, gras), th = fs * 1.15;
    const d = o.R + 3;
    const pos = [
      [o.X + d, o.Y - th / 2, "start", o.X + d, o.Y + fs * 0.36],
      [o.X - d - tw, o.Y - th / 2, "end", o.X - d, o.Y + fs * 0.36],
      [o.X - tw / 2, o.Y - d - th, "middle", o.X, o.Y - d - fs * 0.25],
      [o.X - tw / 2, o.Y + d, "middle", o.X, o.Y + d + fs * 0.85]
    ];
    let ok = null;
    for (const p of pos) {
      const rect = { x0: p[0] - 1, y0: p[1] - 1, x1: p[0] + tw + 1, y1: p[1] + th + 1 };
      if (rect.x0 < 2 || rect.y0 < 2 || rect.x1 > w - 2 || rect.y1 > h - 2) continue;
      if (placees.some(q => coupe(rect, q))) continue;
      if (obst.some(q => q.i !== o.i && q.rg < o.rg && coupe(rect, q))) continue;  // seules les gares plus fréquentées gênent
      ok = [p, rect]; break;
    }
    if (!ok && sel) { const p = pos[0]; ok = [p, { x0: p[0], y0: p[1], x1: p[0] + tw, y1: p[1] + th }]; }
    if (!ok) continue;
    placees.push(ok[1]);
    const [p] = ok;
    const att = `x="${p[3].toFixed(1)}" y="${p[4].toFixed(1)}" text-anchor="${p[2]}" font-size="${fs}" font-weight="${gras ? 600 : 400}" font-family='${POLICE}'`;
    // Halo dessiné à part : Word et PowerPoint ignorent paint-order
    out.push(`<text ${att} fill="${P.carte}" stroke="${P.carte}" stroke-width="3" stroke-linejoin="round">${esc(txt)}</text><text ${att} fill="${sel ? P.selection : P.encre}">${esc(txt)}</text>`);
  }
  return out.join("");
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

let rafId = 0;
function dessiner() {
  if (rafId) return;
  rafId = requestAnimationFrame(() => {
    rafId = 0;
    const v = S.view;
    $("g-base").setAttribute("transform", `matrix(${v.a} 0 0 ${v.a} ${v.bx} ${v.by})`);
    const P = palette(false);
    $("g-dots").innerHTML = dotsSVG(P, v, W, H, false);
    $("g-labels").innerHTML = labelsSVG(P, v, W, H, false);
    legende();
  });
}

/* Légende (HTML à l'écran, SVG dans les exports) */
function refsLegende(fac) {
  const cands = [];
  for (const m of [1, 2, 5]) for (let e = 0; e < 7; e++) cands.push(m * Math.pow(10, e));
  cands.sort((a, b) => a - b);
  // le plus grand cercle de légende reste sous 30 px, même très zoomé
  const top = cands.filter(c => c <= VMAX && rayonFixe(c) * fac <= 30).pop() || cands.filter(c => c <= VMAX).shift() || VMAX;
  const mid = cands.filter(c => c <= top / 8).pop();
  const bas = cands.filter(c => c <= top / 80).pop();
  return [top, mid, bas].filter((v, k, a) => v && a.indexOf(v) === k);
}
function legendeSVG(P, x, y, fac) {
  fac = fac || zf();
  const refs = refsLegende(fac);
  const rr = v => rayonFixe(v) * fac;  // même échelle que les cercles de la carte
  const rmaxv = rr(refs[0]);
  const parts = [];
  let cx = x + rmaxv, base = y + 2 * rmaxv + 4;
  const col = S.mode === "transportes" ? P.normales : S.mode === "embarques" ? P.correspondance : P.encre_douce;
  let yPrec = -1e9, yMax = base;
  refs.forEach((v, k) => {
    const r = rr(v);
    const yTop = base - 2 * r;
    const yTxt = Math.max(yTop + 4, yPrec + 12);  // étiquettes jamais superposées
    yPrec = yTxt; yMax = Math.max(yMax, yTxt + 3);
    parts.push(`<circle cx="${cx}" cy="${base - r}" r="${r}" fill="none" stroke="${col}" stroke-width="1.2"/>`);
    parts.push(`<polyline points="${cx},${yTop} ${x + 2 * rmaxv + 4},${yTop} ${x + 2 * rmaxv + 8},${yTxt - 4}" fill="none" stroke="${P.encre_douce}" stroke-width="0.6" stroke-dasharray="2 2"/>`);
    parts.push(`<text x="${x + 2 * rmaxv + 11}" y="${yTxt}" font-size="11" fill="${P.encre}" font-family='${POLICE}'>${fmt(v)}</text>`);
  });
  return { svg: parts.join(""), w: 2 * rmaxv + 11 + largeur(fmt(refs[0]), 11) + 4, h: yMax - y + 4 };
}
function legende() {
  $("legend").hidden = AUCUN();
  if (AUCUN()) return;
  const P = palette(false);
  const L = legendeSVG(P, 2, 2);
  const lignes = [];
  if (S.mode !== "embarques") lignes.push(`<span><i class="pastille" style="background:var(--normales)"></i>${esc(T("lib_transportes"))}</span>`);
  if (S.mode !== "transportes") lignes.push(`<span><i class="pastille" style="background:var(--correspondance)"></i>${esc(T("lib_embarques"))}</span>`);
  $("legend").innerHTML =
    `<div>${esc(T("legende_cercle"))} <span style="color:var(--encre-douce)">(${esc(unite())})</span></div>` +
    `<svg width="${Math.ceil(L.w + 4)}" height="${Math.ceil(L.h + 4)}">${L.svg}</svg>` +
    `<div class="lg-row">${lignes.join("")}<span><svg width="10" height="10"><circle cx="5" cy="5" r="3.5" fill="none" stroke="var(--encre-douce)"/></svg>${esc(T("legende_zero"))}</span></div>`;
}

/* ---------- interactions carte ---------- */
const pointeurs = new Map();
let glisse = null, pince = null;
const posLocale = e => { const r = svg.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
svg.addEventListener("pointerdown", e => {
  svg.setPointerCapture(e.pointerId);
  pointeurs.set(e.pointerId, posLocale(e));
  if (pointeurs.size === 1) {
    const [x, y] = posLocale(e);
    glisse = { x, y, bx: S.view.bx, by: S.view.by, bouge: 0, cible: e.target.dataset ? e.target.dataset.i : undefined };
  } else if (pointeurs.size === 2) {
    const [p1, p2] = [...pointeurs.values()];
    pince = { d: Math.hypot(p1[0] - p2[0], p1[1] - p2[1]), a: S.view.a };
    glisse = null;
  }
});
svg.addEventListener("pointermove", e => {
  const p = posLocale(e);
  if (pointeurs.has(e.pointerId)) pointeurs.set(e.pointerId, p);
  if (pince && pointeurs.size === 2) {
    const [p1, p2] = [...pointeurs.values()];
    const d = Math.hypot(p1[0] - p2[0], p1[1] - p2[1]);
    const cx = (p1[0] + p2[0]) / 2, cy = (p1[1] + p2[1]) / 2;
    zoomer((pince.a * d / pince.d) / S.view.a, cx, cy);
    cacherTip();
    return;
  }
  if (glisse) {
    const dx = p[0] - glisse.x, dy = p[1] - glisse.y;
    glisse.bouge = Math.max(glisse.bouge, Math.abs(dx) + Math.abs(dy));
    if (glisse.bouge > 3) {
      svg.classList.add("drag");
      S.view = { a: S.view.a, bx: glisse.bx + dx, by: glisse.by + dy };
      dessiner(); cacherTip();
    }
    return;
  }
  const i = e.target.dataset ? e.target.dataset.i : undefined;
  if (i !== undefined && e.pointerType !== "touch") montrerTip(+i, p); else cacherTip();
});
function finPointeur(e) {
  pointeurs.delete(e.pointerId);
  if (pointeurs.size < 2) pince = null;
  if (glisse && glisse.bouge <= 3) {
    const i = glisse.cible;
    if (i !== undefined) choisir(+i, false); else if (e.pointerType === "touch") cacherTip();
    if (i !== undefined && e.pointerType === "touch") montrerTip(+i, posLocale(e));
  }
  glisse = null;
  svg.classList.remove("drag");
}
svg.addEventListener("pointerup", finPointeur);
svg.addEventListener("pointercancel", finPointeur);
svg.addEventListener("pointerleave", e => { if (!glisse) cacherTip(); });
svg.addEventListener("wheel", e => {
  if (!e.ctrlKey && !e.metaKey) return;
  e.preventDefault();
  const [x, y] = posLocale(e);
  zoomer(Math.exp(-e.deltaY * 0.0022), x, y);
}, { passive: false });
$("z-plus").onclick = () => zoomer(1.6);
$("z-moins").onclick = () => zoomer(1 / 1.6);
$("z-tout").onclick = () => { vueEnsemble(); dessiner(); };

function lignesValeurs(i) {
  const rows = [];
  if (S.mode !== "embarques") rows.push([T("lib_transportes"), VN[i], "normales"]);
  if (S.mode !== "transportes") rows.push([T("lib_embarques"), VN[i] + VC[i], "correspondance"]);
  return rows;
}
function montrerTip(i, p) {
  const g = G[i], tip = $("tip");
  const autre = autreG(g) !== nomG(g) ? `<div class="autre">${esc(autreG(g))}</div>` : "";
  const rows = lignesValeurs(i).map(r => `<tr><td>${r[2] ? `<i class="pastille" style="background:var(--${r[2]});margin-right:5px"></i>` : ""}${esc(r[0])}</td><td>${fmt(r[1])}</td></tr>`).join("");
  tip.innerHTML = `<b>${esc(nomG(g))}${g.e ? " *" : ""}</b>${autre}<table>${rows}</table><div class="autre" style="margin-top:4px">${esc(unite())} · ${esc(T("kpi_rang"))} ${rangDe(i)}</div>`;
  tip.hidden = false;
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  let x = p[0] + 14, y = p[1] + 14;
  if (x + tw > W - 6) x = p[0] - tw - 14;
  if (y + th > H - 6) y = p[1] - th - 14;
  tip.style.left = Math.max(6, x) + "px";
  tip.style.top = Math.max(6, y) + "px";
}
function cacherTip() { $("tip").hidden = true; }

/* ---------- sélection, recherche ---------- */
function choisir(i, centrer) {
  S.sel = (i === S.sel && !centrer) ? -1 : i;
  if (S.sel >= 0 && centrer) centrerSur(G[S.sel], 5);
  majTout();
}
$("sel-x").onclick = () => { S.sel = -1; majTout(); };

const q = $("q"), sugg = $("sugg");
let resultats = [], actif = -1;
function chercher() {
  const t = norm(q.value);
  if (!t) { fermerSugg(); return; }
  const debut = [], dedans = [];
  for (const g of G) {
    if (g.k.some(k => k.startsWith(t))) debut.push(g);
    else if (g.k.some(k => k.includes(t))) dedans.push(g);
  }
  const tri = (a, b) => V[b.i] - V[a.i];
  resultats = debut.sort(tri).concat(dedans.sort(tri)).slice(0, 9);
  actif = resultats.length ? 0 : -1;
  rendreSugg();
}
function rendreSugg() {
  sugg.innerHTML = resultats.length
    ? resultats.map((g, k) => `<li role="option" data-i="${g.i}" aria-selected="${k === actif}"><span>${esc(nomG(g))}</span>${autreG(g) !== nomG(g) ? `<small>${esc(autreG(g))}</small>` : ""}</li>`).join("")
    : `<li class="vide">${esc(T("recherche_aucun"))}</li>`;
  sugg.hidden = false;
  q.setAttribute("aria-expanded", "true");
}
function fermerSugg() { sugg.hidden = true; q.setAttribute("aria-expanded", "false"); resultats = []; actif = -1; }
q.addEventListener("input", chercher);
q.addEventListener("focus", () => { if (q.value) chercher(); });
q.addEventListener("keydown", e => {
  if (e.key === "ArrowDown" && resultats.length) { actif = (actif + 1) % resultats.length; rendreSugg(); e.preventDefault(); }
  else if (e.key === "ArrowUp" && resultats.length) { actif = (actif - 1 + resultats.length) % resultats.length; rendreSugg(); e.preventDefault(); }
  else if (e.key === "Enter" && actif >= 0) { prendre(resultats[actif].i); e.preventDefault(); }
  else if (e.key === "Escape") { q.value = ""; fermerSugg(); }
});
sugg.addEventListener("pointerdown", e => { const li = e.target.closest("li[data-i]"); if (li) { e.preventDefault(); prendre(+li.dataset.i); } });
document.addEventListener("pointerdown", e => { if (!e.target.closest(".recherche")) fermerSugg(); });
function prendre(i) { q.value = ""; fermerSugg(); q.blur(); S.sel = -1; choisir(i, true); }
